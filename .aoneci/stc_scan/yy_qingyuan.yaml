triggers:
  push:
    branches: '**'

name: "源码发布扫描(yy、清源)"
params:
  incremental_scan:
    description: '是否仅扫描增量代码,默认为true.可选值 {Y, N}'
    required: false
    type: string
    default: 'Y'

jobs:
  yy_scan:
    name: "敏感信息扫描"
    timeout: 5h
    steps:
      - uses: ci-security-scan
        id: security-scan
        inputs:
          # 是否仅扫描增量代码
          incremental_scan: ${{params.incremental_scan}} # 可选值 {Y, N}
          # 参考 YUNYI 规则列表设置合适的扫描规则： https://alidocs.dingtalk.com/i/nodes/oP0MALyR8kzGnoOwFZdGL7nyJ3bzYmDO
          yy_rule_id: "133"

          # 下面选项可保持字面量不变
          project_id: ${{git.projectId}}
          git_url: ${{git.url}}
          branch: '${{params.incremental_scan == "Y" ? git.push.afterSha256 : git.branch}}'
          target_branch: '${{params.incremental_scan == "Y" ? git.push.beforeSha256 : git.branch}}'
          pipeline_instance_id: ${{pipeline.inst.id}}
      - id: check
        timeout: 3h
        run: |-
          if [ '${{steps.security-scan.outputs.yy_bugs_cnt}}' -eq 0 ]; then
            echo "YY check PASS"
            exit 0
          else
            echo "YY check failed, refer to the scan log for more information."
            exit 1
          fi
  qy_scan:
    name: "清源扫描"
    steps:
      - uses: qy-scan
        inputs:
          token: ${{secrets.qysca_token}}
          ref: ${{git.commitId}}
          repo: http://gitlab.alibaba-inc.com/T-HEAD/hggc-samples.git
      - uses: upload-oss
        inputs:
          path: qyscan_report.json