triggers:
  merge_request:
    target-branches: 
      - ppu_open_source
name: "Coverity扫描"
params:
  product:
    description: '产品, 默认ppu'
    required: false   
    type: string
    default: 'ppu'
  sdk_type:
    description: 'sdk类型, 默认release'
    required: false   
    type: string
    default: 'release'
  cuda_versions:
    description: '多个cuda版本'
    required: false   
    type: array
    options: ['12.6.0', '12.8.0', '12.9.0','13.0.0']
    default: ['13.0.0']
  sdk_versions:
    description: '多个sdk版本'
    required: false
    type: array
    options: ['2.0.0', '2.1.0','1.7.0']
    default: ['2.1.0']
  sdk_daily_version:
    description: 'sdk版本, 默认latest'
    required: false   
    type: string
    default: 'latest'

jobs:
  hggc-samples-coverity-ubuntu24-py312:
    name: "hggc-samples-build-ubuntu24-py312"
    image: "reg.docker.alibaba-inc.com/ai-tmp/pytorch:ubuntu24.04-py312.06"
    timeout: 12h
    runs-on:
      - 32-128Gi
      - amd64
    matrix:
      params:
        - name: cuda_version
          value: ${{params.cuda_versions}}
        - name: sdk_version
          value: ${{params.sdk_versions}}
    steps:
      - run: echo "11.162.25.191 art-pub.eng.t-head.cn" >> /etc/hosts
      - uses: checkout
        inputs:
          enable-cache: true
          submodules: false
          submodule-fetch-depth: 0
      - uses: setup-github-proxy
      - uses: ptg-sdk-setup  # 会下载并解压到$AONE_CI_WORKSPACE/opt/PPU_SDK
        inputs:
          cuda_version: ${{matrix.cuda_version}}
          type: "daily"
          sdk_daily_version: ${{params.sdk_daily_version}}
          os: "ubuntu2404"
          product: ${{params.product}}
      - envs:
          os_version: 'ubuntu2404'
          python_version: 'py312'
          cuda_version: ${{matrix.cuda_version}}
          pytorch_version: ${{matrix.torch_version}}
        name: "Build with coverity"
        timeout: 5h
        run: |
          echo "Setup coverity---------------------"
          cp .aoneci/stc_scan/coverity_scan.sh /opt/coverity_scan.sh
          wget --no-check-certificate -q -O /opt/coverity-linux64-2024.06.zip https://art-pub.eng.t-head.cn:443/artifactory/example-repo-local/coverity-linux64-2024.06.zip
          unzip -q -o /opt/coverity-linux64-2024.06.zip -d /opt/
          apt update && apt install -y --no-install-recommends uuid-runtime
          echo "Starting build with coverity---------------------"
          export source_home=$AONE_CI_SOURCE
          export build_output=$AONE_CI_SOURCE/output
          mkdir -p $build_output
          cp .aoneci/script/build.sh ./
          source /opt/coverity_scan.sh /opt/coverity-linux64-2024.06 $AONE_CI_SOURCE build.sh
          ls -lha $build_output
          ls -lh $AONE_CI_SOURCE/idir.tar.gz
      - uses: upload-oss
        name: "Upload coverity report"
        inputs:
          path: idir.tar.gz
      - uses: stc-scan@0.0.1
        inputs:
          app_key: ${{secrets.top_app_key}}
          app_token: ${{secrets.top_app_token}}
          git_branch: ${{git.commitId}}
          git_repo: git@gitlab.alibaba-inc.com:T-HEAD/hggc-samples.git
          mode: compile
          report_url: https://aone-ci-reports.alibaba-inc.com/public/${{pipeline.inst.id}}/idir.tar.gz
          skip_path: 3rdparty/
      - uses: upload-oss
        inputs:
          path: stc_report.json
strategy:
  fast-fail: false
